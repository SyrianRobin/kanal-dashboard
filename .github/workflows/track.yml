name: Kanäle tracken

on:
  schedule:
    - cron: "*/20 * * * *"   # alle 20 Minuten (GitHub startet manchmal ein paar Minuten später)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet --upgrade yt-dlp cryptography
      - name: Zahlen holen
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python track.py fetch
      - name: Verschlüsselt speichern
        run: |
          git config user.name "kanal-tracker"
          git config user.email "kanal-tracker@users.noreply.github.com"
          cp fetched.json /tmp/fetched.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/fetched.json fetched.json
            python track.py write
            git add -A data
            git diff --cached --quiet && exit 0
            git commit -q -m "Zahlen aktualisiert"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
